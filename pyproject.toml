[tool.poetry]
name = "flangoberry"
version = "0.1.0"
description = "Flask + ArangoDB + Strawberry GraphQL"
authors = ["Irfan Baig <riverfr0zen@elitemail.org>"]
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = "^3.11.2"
python-arango = "^8.2.2"
Flask = "^2.3.2"
strawberry-graphql = "^0.184.0"
flask-cors = "^4.0.0"


[tool.poetry.group.dev.dependencies]
flake8 = "^7.3.0"
coverage = "^7.2.5"
pytest-cov = "^7.0.0"
pytest = "^8.4.2"
black = "^25.9.0"
safety = "^3.6.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
